<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intastellar Cookie Sharing infos</title>
</head>

<body>
    <script>
    // Proxy consent requests between parent and backend, supporting domain groups
    window.addEventListener("message", async (event) => {
        // Optionally, validate event.origin against allowed domains
        // Example: if (!['https://domain-a.com', 'https://domain-b.com'].includes(event.origin)) return;

        const { type, userId, consents, rootDomain, partnerDomains } = event.data;

        if (type === "getConsent") {
            // Fetch consent from backend, passing rootDomain
            try {
                const res = await fetch(`/tests/backend/test.php?userId=${encodeURIComponent(userId)}&rootDomain=${encodeURIComponent(rootDomain)}`);
                const result = await res.json();
                event.source.postMessage({ type: "consentState", consents: result.consents || result, partnerDomains: result.partnerDomains || [], rootDomain }, event.origin);
            } catch (e) {
                event.source.postMessage({ type: "consentState", consents: {}, partnerDomains: [], rootDomain }, event.origin);
            }
        }
        if (type === "setConsent") {
            try {
                await fetch("/tests/backend/test.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, consents, rootDomain, partnerDomains })
                });
                event.source.postMessage({ type: "consentState", consents, partnerDomains, rootDomain }, event.origin);
            } catch (e) {
                event.source.postMessage({ type: "consentState", consents, partnerDomains, rootDomain }, event.origin);
            }
        }
    });

    // Notify parent that iframe is ready
    window.parent.postMessage("ready", "*");
    </script>
    </script>
</body>

</html>
