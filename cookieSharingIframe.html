<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intastellar Cookie Sharing infos</title>
</head>

<body>
    <script>
    // Proxy consent requests between parent and backend
    window.addEventListener("message", async (event) => {
        // Optionally, validate event.origin against allowed domains
        // Example: if (!['https://domain-a.com', 'https://domain-b.com'].includes(event.origin)) return;

        if (event.data.type === "getConsent") {
            // Fetch consent from backend
            try {
                const res = await fetch("/tests/backend/test.php?userId=" + encodeURIComponent(event.data.userId));
                const consents = await res.json();
                event.source.postMessage({ type: "consentState", consents }, event.origin);
            } catch (e) {
                event.source.postMessage({ type: "consentState", consents: {} }, event.origin);
            }
        }
        if (event.data.type === "setConsent") {
            try {
                await fetch("/tests/backend/test.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: event.data.userId, consents: event.data.consents })
                });
                event.source.postMessage({ type: "consentState", consents: event.data.consents }, event.origin);
            } catch (e) {
                event.source.postMessage({ type: "consentState", consents: event.data.consents }, event.origin);
            }
        }
    });

    // Notify parent that iframe is ready
    window.parent.postMessage("ready", "*");
    </script>
    </script>
</body>

</html>
